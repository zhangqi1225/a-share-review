<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股复盘档案 · 少妇战法版</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7f9; --card:#ffffff; --line:#e6e8ec;
  --text:#1a1d21; --muted:#7a8290; --brand:#2743d9;
  --up:#e24a3a; --up-bg:#fdeceb; --down:#0a9d72; --down-bg:#e8f7f1; --flat:#8a8f98;
  --shadow:0 1px 3px rgba(20,24,40,.06),0 6px 20px rgba(20,24,40,.05);
  --radius:14px;
  --head-bg:rgba(255,255,255,.85);
}
[data-theme="dark"]{
  --bg:#0f1115; --bg2:#161a21; --card:#1a1f28; --line:#2a3140;
  --text:#e8ebf1; --muted:#8b93a6; --brand:#5b7bff;
  --up:#ff6b59; --up-bg:#3a201d; --down:#34d3a1; --down-bg:#15352b; --flat:#7c8494;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  --head-bg:rgba(15,17,21,.85);
}
[data-theme="blue"]{
  --bg:#f2f6ff; --bg2:#e9effd; --card:#ffffff; --line:#dbe5f6;
  --text:#15233f; --muted:#5c6b8a; --brand:#1d4ed8;
  --up:#db3b34; --up-bg:#fdecea; --down:#0aa06e; --down-bg:#e6f7f0; --flat:#7b879e;
  --shadow:0 1px 3px rgba(23,64,150,.08),0 8px 24px rgba(23,64,150,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .25s,color .25s}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:var(--head-bg);border-bottom:1px solid var(--line)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 18px;height:60px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#6a4bff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:-2px}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
nav button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .15s}
nav button:hover{color:var(--text);background:var(--bg2)}
nav button.active{color:var(--brand);background:var(--brand);color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--muted);font-size:16px}
.theme-btn:hover{color:var(--text)}
.menu-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--text);font-size:18px}
@media(min-width:920px){.menu-btn{display:none}}

/* ---------- Layout ---------- */
.layout{max-width:1280px;margin:0 auto;padding:22px 18px 60px;display:flex;gap:24px}
main{flex:1;min-width:0}

/* ---------- Sidebar ---------- */
.sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
/* calendar */
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:14px}
.cal-head .nav{display:flex;gap:4px}
.cal-head .nav button{width:28px;height:28px;border-radius:7px;background:var(--bg2);color:var(--muted);font-size:13px}
.cal-head .nav button:hover{color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
.cal-grid .day{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);position:relative;cursor:pointer}
.cal-grid .day.other{opacity:.32}
.cal-grid .day:hover{background:var(--bg2)}
.cal-grid .day.has::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.cal-grid .day.sel{background:var(--brand);color:#fff;font-weight:700}
.cal-grid .day.sel.has::after{background:#ffd23f}
.cal-grid .day.today{border:1px solid var(--brand)}

/* history list */
.hist-title{font-size:13px;font-weight:700;color:var(--muted);padding:2px 4px 8px}
.hist-list{display:flex;flex-direction:column;gap:8px}
.hist-item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:var(--card);transition:all .15s}
.hist-item:hover{border-color:var(--brand)}
.hist-item.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.hist-item .d{font-size:12px;font-weight:700;color:var(--muted)}
.hist-item .t{font-size:14px;font-weight:700;margin:2px 0 4px;line-height:1.35}
.hist-item .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}

/* ---------- Content ---------- */
.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.report-hero{background:linear-gradient(135deg,var(--bg2),var(--card));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px}
.report-hero .rd{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.report-hero h1{font-size:clamp(20px,3vw,30px);font-weight:800;margin:6px 0;line-height:1.3}
.report-hero .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:22px;font-weight:800;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi .chg{font-weight:700;font-size:13px}

.section-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:26px 0 12px}
.section-title .num{width:24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
.section-title small{font-weight:600;color:var(--muted);font-size:12px}

/* index heat grid */
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.idx-cell{border-radius:12px;padding:13px 15px;color:#fff;position:relative;overflow:hidden}
.idx-cell .nm{font-size:13px;font-weight:700;opacity:.95}
.idx-cell .px{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.idx-cell .pc{font-size:13px;font-weight:700;opacity:.95;margin-top:1px}
.idx-cell .ohlc{font-size:11px;opacity:.85;margin-top:6px;font-variant-numeric:tabular-nums}
.idx-legend{font-size:12px;color:var(--muted);margin-top:8px}

/* two-col */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--bg2)}
tr:last-child td{border-bottom:none}

/* list rows */
.row{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ic{width:32px;height:32px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.row .b{flex:1}
.row .b .h{font-weight:700;font-size:14px}
.row .b .d{font-size:13px;color:var(--muted)}

.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--bg2);color:var(--text);margin:2px 4px 2px 0}

/* empty placeholder */
.empty{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{color:var(--text)}

/* module roadmap (完整版12模块占位) */
.roadmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.roadmap-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;opacity:.78;box-shadow:var(--shadow)}
.roadmap-item .rn{font-size:11px;font-weight:800;color:var(--muted)}
.roadmap-item .rt{font-weight:700;font-size:14px;margin-top:2px}
.roadmap-item .rs{font-size:12px;color:var(--muted);margin-top:4px}

/* markdown notes */
.notes h3{font-size:15px;margin-top:16px;margin-bottom:6px}
.notes p{margin:6px 0;font-size:14px}
.notes ul,.notes ol{margin:6px 0 6px 20px;font-size:14px}
.notes li{margin:3px 0}
.notes blockquote{border-left:3px solid var(--brand);padding:6px 12px;background:var(--bg2);border-radius:0 8px 8px 0;margin:8px 0;color:var(--muted)}

/* misc */
.muted{color:var(--muted)}
.up{color:var(--up)!important}
.down{color:var(--down)!important}

.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}

.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 10px}

/* ---------- Mobile sidebar ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;background:var(--bg);z-index:100;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow);padding:20px;overflow-y:auto}
.drawer.show{transform:none}
@media(min-width:920px){.overlay,.drawer{display:none}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
    <div class="brand">
      <div class="logo">K</div>
      <div>A股复盘档案<small id="brandSub">少妇战法 · 每日收盘复盘</small></div>
    </div>
    <nav id="mainNav">
      <button data-panel="overview" class="active">复盘总览</button>
      <button data-panel="report">完整报告</button>
      <button data-panel="history">历史档案</button>
      <button data-panel="source">数据来源</button>
    </nav>
    <div class="header-right">
      <button class="theme-btn" id="themeBtn" title="切换主题">🌙</button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div id="drawerContent"></div>
</aside>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main>
    <!-- 复盘总览 -->
    <section class="panel active" id="panel-overview"></section>

    <!-- 完整报告 -->
    <section class="panel" id="panel-report"></section>

    <!-- 历史档案 -->
    <section class="panel" id="panel-history"></section>

    <!-- 数据来源 -->
    <section class="panel" id="panel-source"></section>
  </main>
</div>

<div class="footer" id="footer"></div>

<script src="./data.js"></script>
<script>
/* =========================================================
 * A股复盘档案 · 少妇战法版
 * 数据：window.REPORTS = {meta, reports:[...]}
 * ========================================================= */
const DATA = (window.REPORTS && Array.isArray(window.REPORTS.reports)) ? window.REPORTS : {meta:{}, reports:[]};
let selectedDate = null;   // 当前选中日期(YYYY-MM-DD)
let calYear, calMonth;     // 日历当前年月
let currentPanel = 'overview';

const UP='#e24a3a', DOWN='#0a9d72';
const sigMap = {
  'FULL_POSITION': {t:'满仓', c:'#e24a3a', bg:'#fdeceb'},
  'REDUCE':        {t:'减仓/清仓', c:'#0a9d72', bg:'#e8f7f1'},
  'RANGE':         {t:'震荡 · 半仓B1', c:'#8a6b00', bg:'#fff5d6'}
};
const themes = ['light','dark','blue'];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
function fmt(n, d=0){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pctCls(p){ return p==null || isNaN(p) ? '' : (p>0?'up':(p<0?'down':'')); }
function sign(p){ return p==null||isNaN(p) ? '' : (p>0?'+':''); }
function heat(p){ // 返回 [bg] 单色深浅
  if(p==null||isNaN(p)) return '#8a8f98';
  const a = Math.min(1, Math.abs(p)/4);
  if(p>=0){ const r=Math.round(226-(140*a)); return `rgb(${r},${Math.round(74-44*a)},${60})`; }
  const r=Math.round(20+(190*a)); return `rgb(${r},${Math.round(150+55*a)},${Math.round(110+75*a)})`;
}
function sigMeta(sig){
  const m = sigMap[sig] || sigMap['RANGE'];
  return {text:(sigMetaText[sig]||m.t), color:m.c, bg:m.bg};
}
const sigMetaText = {
  'FULL_POSITION':'满仓 · 大阳线确立',
  'REDUCE':'减仓/清仓 · 放量下跌',
  'RANGE':'震荡区间 · 半仓 · 只做B1'
};

function reportByDate(d){ return DATA.reports.find(r=>r.date===d) || null; }
function sortedDates(){ return DATA.reports.map(r=>r.date).sort(); }

function getIdxList(r){
  return Object.entries(r.index||{}).map(([name,v])=>({name, ...(typeof v==='object'?v:{close:v})}));
}

/* ---------- Sidebar: 日历 + 列表 ---------- */
function renderCalendar(){
  const today = new Date();
  const now = new Date();
  calYear = calYear==null ? now.getFullYear() : calYear;
  calMonth = calMonth==null ? now.getMonth() : calMonth;
  const dates = new Set(sortedDates());
  const first = new Date(calYear,calMonth,1);
  const startDow = (first.getDay()+6)%7;          // 周一=0
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const weeks = Math.ceil((startDow+daysInMonth)/7);
  let html = `<div class="cal-card">
    <div class="cal-head">
      <b>${calYear}年${calMonth+1}月</b>
      <div class="nav">
        <button data-cal="-1">‹</button><button data-cal="1">›</button>
      </div>
    </div>
    <div class="cal-grid">`;
  ['一','二','三','四','五','六','日'].forEach(d=>html+=`<div class="dow">${d}</div>`);
  for(let i=0;i<weeks*7;i++){
    const dayNum = i-startDow+1;
    if(dayNum<1||dayNum>daysInMonth){ html+=`<div class="day other"></div>`; continue; }
    const ymd = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const has = dates.has(ymd);
    const sel = ymd===selectedDate ? ' sel':'';
    const tod = (ymd===`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`) ? ' today':'';
    html+=`<div class="day${has?' has':''}${sel}${tod}" data-date="${ymd}" title="${ymd}${has?' · 有复盘':''}">${dayNum}</div>`;
  }
  html+=`</div></div>`;
  // 历史列表
  html += `<div class="hist-title">历史档案 · ${DATA.reports.length} 份</div><div class="hist-list">`;
  DATA.reports.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    const act = r.date===selectedDate ? ' active':'';
    const meta = sigMeta(r.signal);
    html += `<div class="hist-item${act}" data-date="${r.date}">
      <div class="d">${r.date}</div>
      <div class="t">${esc(r.title||'当日复盘摘要')}</div>
      <div class="m">
        <span class="badge" style="color:${meta.color};background:${meta.bg}">${meta.text}</span>
        ${r.confidence?`<span class="badge" style="background:var(--bg2);color:var(--muted)">置信度·${esc(r.confidence)}</span>`:''}
      </div></div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------- 指数热力卡 ---------- */
function idxCards(r){
  const list = getIdxList(r);
  if(!list.length) return `<div class="empty">暂无指数数据</div>`;
  let html = '<div class="idx-grid">';
  list.forEach(x=>{
    const bg = heat(x.pct);
    const ohlc = (x.open!=null&&x.high!=null&&x.low!=null)
      ? `开 ${fmt(x.open,2)} · 高 ${fmt(x.high,2)} · 低 ${fmt(x.low,2)}` : '';
    html += `<div class="idx-cell" style="background:${bg}">
      <div class="nm">${esc(x.name)}</div>
      <div class="px">${fmt(x.close,2)}</div>
      <div class="pc">${sign(x.pct)}${fmt(x.pct,2)}%</div>
      ${ohlc?`<div class="ohlc">${ohlc}</div>`:''}
    </div>`;
  });
  html += '</div><div class="idx-legend">底色深浅 = 涨跌幅绝对值；红涨 / 绿跌。（数字四舍五入）</div>';
  return html;
}

/* ---------- 关键指标卡 ---------- */
function kpiCards(r){
  const c = (p,lbl) => p==null ? '' : `<span class="chg ${pctCls(p)}">${sign(p)}${fmt(Math.abs(p),2)}% <span class="muted">${lbl}</span></span>`;
  return `<div class="kpi-row">
    <div class="kpi"><div class="lbl">活跃市值</div><div class="val">${fmt(r.amv_yi,0)}<span style="font-size:13px;color:var(--muted)"> 亿</span></div><div class="sub">${c(r.amv_pct,'较前日')||'—'}</div></div>
    <div class="kpi"><div class="lbl">两融余额</div><div class="val">${r.rzrq_yi!=null?fmt(r.rzrq_yi,0):'—'}<span style="font-size:13px;color:var(--muted)"> 亿</span></div><div class="sub">${c(r.rzrq_pct,'较前日')||r.rzrq_date?('披露日 '+(r.rzrq_date||'')):''}</div></div>
    <div class="kpi"><div class="lbl">两市成交额</div><div class="val">${r.amount_yi?fmt(r.amount_yi,0):'—'}<span style="font-size:13px;color:var(--muted)"> 亿</span></div><div class="sub">${r.amount_note||''}</div></div>
    <div class="kpi"><div class="lbl">市场宽度</div><div class="val" style="font-size:18px">${r.width&&r.width.ratio!=null?fmt(r.width.ratio*100,1)+'%':'—'}</div><div class="sub">${r.width?`涨 ${r.width.up??'—'} · 跌 ${r.width.down??'—'} · 平 ${r.width.flat??'—'}`:''}</div></div>
  </div>`;
}

/* ---------- 择时研判 ---------- */
function timingBlock(r){
  const meta = sigMeta(r.signal);
  const rows = [
    ['择时信号', `<span class="badge" style="color:${meta.color};background:${meta.bg};font-size:12px">${meta.text}</span>`, ''],
    ['活跃市值', `${fmt(r.amv_yi,0)} 亿`, sign(r.amv_pct)+fmt(r.amv_pct,2)+'%'],
    ['两融余额', (r.rzrq_yi!=null?fmt(r.rzrq_yi,0):'—')+' 亿', r.rzrq_pct!=null?sign(r.rzrq_pct)+fmt(r.rzrq_pct,2)+'%':'']
  ];
  const chg = r.amv_pct;
  let view;
  if(chg==null) view='—';
  else if(chg>=4) view='🔴 大阳线 → 满仓（活跃市值单日+4%以上）';
  else if(chg<=-2.3) view='🟢 放量下跌 → 减仓或清仓（活跃市值单日-2.3%以下）';
  else view='⚪ 震荡区间 → 半仓，只做B1买点';
  let html = `<table><tbody>`;

/* ---------- 简单 markdown 渲染 ---------- */
function mdToHtml(md){
  return esc(md)
    .replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/^## (.*)$/gm,'<h3>$1</h3>')
    .replace(/^# (.*)$/gm,'<h3>$1</h3>')
    .replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^[-*] (.*)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)\n?((?:<li>[\s\S]*?<\/li>\n?)*)/gm,(m,f,g)=>`<ul>${f}${g}</ul>`)
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code style="background:var(--bg2);border-radius:4px;padding:1px 5px">$1</code>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/([^\n]+)\n([^\n]+)/g,'$1<br>$2');
}

/* ---------- Markdown 导出 ---------- */
function buildMarkdown(r){
  const meta = sigMeta(r.signal);
  let lines = [`# ${r.date} · ${r.title||'当日复盘摘要'}`,
    ``,
    `- **择时信号**：${meta.text}`,
    `- **活跃市值**：${fmt(r.amv_yi,0)} 亿（${sign(r.amv_pct)}${fmt(r.amv_pct,2)}%）`,
    `- **两融余额**：${r.rzrq_yi!=null?fmt(r.rzrq_yi,0)+' 亿':'-'}${r.rzrq_pct!=null?`（${sign(r.rzrq_pct)}${fmt(r.rzrq_pct,2)}%）`:''}`,
    ``,
    `## 指数`,
    ``];
  getIdxList(r).forEach(x=>lines.push(`- ${x.name}：${fmt(x.close,2)}（${sign(x.pct)}${fmt(x.pct,2)}%）`));
  if(r.sectors&&r.sectors.length){ lines.push('','## 板块主线',''); r.sectors.forEach(s=>lines.push(typeof s==='string'?`- ${s}`:`- **${s.name}** ${sign(s.pct)}${fmt(s.pct,2)}%（领涨：${s.leader||'—'}）`)); }
  if(r.zt){ lines.push('','## 涨停梯队','',`- 涨停 ${r.zt.total} 家，最高 ${r.zt.max_lb} 板`); if(r.zt.hy_top&&r.zt.hy_top.length) lines.push(`- 情绪主线：${r.zt.hy_top.map(h=>`${h.name}×${h.count}`).join('、')}`); if(r.zt.tops&&r.zt.tops.length){ lines.push('','| 高标股 | 连板 | 行业 | 涨幅 |','|---|---|---|---|'); r.zt.tops.forEach(s=>lines.push(`| ${s.name} | ${s.lbc}板 | ${s.hybk} | ${sign(s.zdp)}${fmt(s.zdp,2)}% |`)); } }
  if(r.lhb){ lines.push('','## 龙虎榜','',`- 上榜 ${r.lhb.total} 只（去重）`); if(r.lhb.buy_top) r.lhb.buy_top.forEach(s=>lines.push(`- 净买 **${s.name}** ${sign(s.net_yi)}${fmt(Math.abs(s.net_yi),2)}亿（${s.explain}）`)); if(r.lhb.sell_top) r.lhb.sell_top.forEach(s=>lines.push(`- 净卖 **${s.name}** ${sign(s.net_yi)}${fmt(Math.abs(s.net_yi),2)}亿（${s.explain}）`)); }
  if(r.positions&&r.positions.length){ lines.push('','## 持仓回顾',''); r.positions.forEach(p=>lines.push(`- ${p.name}：${p.change!=null?sign(p.change)+fmt(p.change,2)+'%':p.perf||''} ${p.conclusion||''}`)); }
  const p=r.plan||{}; if(p.conclusion||p.direction||p.hold||p.watch){ lines.push('','## 次日预案',''); [['结论',p.conclusion],['方向',p.direction],['持仓',p.hold],['关注',p.watch],['止损',p.stop]].forEach(([k,v])=>v&&lines.push(`- **${k}**：${v}`)); }
  if(r.notes&&r.notes.trim()){ lines.push('','## 完整复盘','',r.notes.replace(/\n/g,'\n')); }
  const txt = lines.join('\n');
  try{ navigator.clipboard.writeText(txt).then(()=>alert('已复制 Markdown 到剪贴板')); }
  catch(e){ prompt('复制失败，请手动复制：', txt); }
}

  if(item){ selectDate(item.dataset.date, false); if(item.classList.contains('hist-item')) switchPanel('overview'); return; }
  const navBtn = e.target.closest('#mainNav button');
  if(navBtn){ switchPanel(navBtn.dataset.panel); return; }
});
$('#themeBtn').onclick = cycleTheme;
$('#menuBtn').onclick = openDrawer;
$('#overlay').onclick = closeDrawer;

/* init */
(function init(){
  const saved = (()=>{ try{ return localStorage.getItem('ashare-theme'); }catch(e){ return null; } })();
  if(saved&&themes.includes(saved)){ document.documentElement.setAttribute('data-theme',saved); $('#themeBtn').textContent = saved==='dark'?'☀️':(saved==='blue'?'🌗':'🌙'); }
  if(DATA.meta.subtitle) $('#brandSub').textContent = DATA.meta.subtitle || '少妇战法 · 每日收盘复盘';
  $('#footer').textContent = `${DATA.meta.siteTitle||'A股复盘档案'} · 更新于 ${esc(DATA.meta.updated||'—')} · 个人复盘工具，仅供参考`;
  const ds = sortedDates();
  if(ds.length){ selectedDate = ds[ds.length-1]; }
  else { const d=new Date(); selectedDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  renderSidebar();
  switchPanel('overview');
})();
</script>
</body>
